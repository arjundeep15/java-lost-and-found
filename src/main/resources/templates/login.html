<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · CampusFind</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><a class="back-home" href="/">← Back to home</a><div class="auth-layout"><div class="auth-side"><a class="brand" href="/"><span class="brand-icon">✦</span><span>campus<span class="brand-accent">find</span><small>LOST & FOUND PORTAL</small></span></a><span class="eyebrow">WELCOME BACK</span><h1>Good things<br>find their <em>way home.</em></h1><p>Your campus community is here to help.</p><div class="auth-illustration"><img src="/images/items/backpack.svg" alt="Backpack"><img src="/images/items/keys.svg" alt="Keys"><img src="/images/items/earbuds.svg" alt="Earbuds"></div></div><div class="auth-card"><span class="eyebrow">YOUR ACCOUNT</span><h2>Sign in</h2><p class="muted">Choose your account type to continue.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="alert success" th:if="${success}" th:text="${success}"></div><form method="post" action="/login" class="form-stack"><label>Email address<input type="email" name="email" placeholder="you@campus.edu" required></label><label>Password<input type="password" name="password" placeholder="Enter your password" required></label><label>Account type<select name="role" required><option value="STUDENT">Student account</option><option value="ADMIN">Administrator account</option></select></label><button class="btn btn-primary btn-full">Sign in ↗</button></form><p class="auth-bottom">New student? <a href="/register">Create an account</a></p><div class="demo-note"><b>Administrator demo</b><br>Email: admin@campus.edu<br>Password: admin123</div></div></div></body></html>
