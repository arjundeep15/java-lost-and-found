<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an item · CampusFind</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-icon">✦</span><span>campus<span class="brand-accent">find</span><small>LOST & FOUND PORTAL</small></span></a><nav><a href="/">Explore</a><a href="/dashboard">Dashboard</a><form method="post" action="/logout"><button class="btn btn-light">Log out</button></form></nav></header><main class="form-page"><span class="eyebrow">HELP AN ITEM FIND ITS WAY</span><h1>Report an <em>item.</em></h1><p class="muted">Share a few details so the campus community can help.</p><form class="report-form" method="post" action="/report"><label>Item name<input name="title" required maxlength="120" placeholder="e.g. Blue water bottle"></label><label>What happened?<select name="itemStatus"><option value="LOST">I lost this item</option><option value="FOUND">I found this item</option></select></label><label>Category<select name="category"><option>Electronics</option><option>Books & stationery</option><option>Personal items</option><option>Cards & ID</option><option>Bags</option><option>Other</option></select></label><label>Choose an illustration<select name="imageName"><option value="notebook.svg">Notebook</option><option value="bottle.svg">Water bottle</option><option value="keys.svg">Keys</option><option value="calculator.svg">Calculator</option><option value="umbrella.svg">Umbrella</option><option value="idcard.svg">ID card</option><option value="earbuds.svg">Earbuds</option><option value="backpack.svg">Backpack</option></select></label><label class="wide">Description<textarea name="description" rows="4" placeholder="Colour, brand, identifying details..." required></textarea></label><label>Location<input name="locationFound" placeholder="e.g. Library, Block A"></label><label>Contact information<input name="contact" required placeholder="Email or phone number"></label><button class="btn btn-primary btn-large wide">Publish report ↗</button></form></main></body></html>
