<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · CampusFind</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><a class="back-home" href="/">← Back to home</a><div class="auth-layout"><div class="auth-side"><a class="brand" href="/"><span class="brand-icon">✦</span><span>campus<span class="brand-accent">find</span><small>LOST & FOUND PORTAL</small></span></a><span class="eyebrow">JOIN YOUR COMMUNITY</span><h1>Small actions.<br><em>Big difference.</em></h1><p>Create a student account to report items and help others.</p><div class="auth-illustration"><img src="/images/items/notebook.svg" alt="Notebook"><img src="/images/items/bottle.svg" alt="Bottle"><img src="/images/items/idcard.svg" alt="ID card"></div></div><div class="auth-card"><span class="eyebrow">GET STARTED</span><h2>Create student account</h2><p class="muted">It only takes a minute.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/register" class="form-stack"><label>Full name<input name="name" placeholder="Your name" required maxlength="100"></label><label>Email address<input type="email" name="email" placeholder="you@campus.edu" required></label><label>Password<input type="password" name="password" placeholder="At least 6 characters" required minlength="6"></label><button class="btn btn-primary btn-full">Create account ↗</button></form><p class="auth-bottom">Already registered? <a href="/login">Sign in</a></p></div></div></body></html>
